    .name{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:700}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#7f8ea8}
    .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#c6d1e2}
    .seg{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#93c5fd}
    .badge{fill:#1e2a44}
    .badget{font-family:JetBrains Mono,Consolas,monospace;font-size:11px;font-weight:700;fill:#22d3ee;text-anchor:middle}
    .rt{fill:#101a2e;stroke:#94a3b8;stroke-width:2}
    .rtn{font-family:JetBrains Mono,Consolas,monospace;font-size:13px;font-weight:700;fill:#eef3fb}
    .rts{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#7f8ea8}
    .vmn{font-family:JetBrains Mono,Consolas,monospace;font-size:14px;font-weight:700}
    .vms{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#7f8ea8}
    .port{font-family:JetBrains Mono,Consolas,monospace;font-size:11.5px;font-weight:700;fill:#7dd3fc;text-anchor:middle}
    .wire{stroke:#94a3b8;stroke-width:2;fill:none}
    .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none}
    .grp{fill:none;stroke:#a78bfa;stroke-width:2;stroke-dasharray:8 6}
  </style>
