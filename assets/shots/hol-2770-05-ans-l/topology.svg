<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2770-05-ANS-L</title>
  <desc id="d">Outside clients: Internet clients (192.0.0.2-100), malicious North Korea (175.45.176.9-100), malicious Iran (5.190.1.21-100) and corporate clients (192.168.10.1), all coming in through the Tier-0 gateway t0-wld01-a, where the gateway firewall drops Iran and North Korea with GeoIP rules. Behind it, Tier-1 t1-dmz01-a has the web tier on web-seg-a (10.1.13.0/24): web01a, web02a and web03a. Tier-1 t1-wld-a has the app tier (app01a and app02a on app-seg-a) and the database tier (db01a on db-seg-a). Web talks to app on TCP 8080, app talks to db on TCP 3306 with a Layer 7 MySQL profile. All six VMs are in 3-tier-app-group, protected by the distributed firewall.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
  </defs>
  <style>
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .card{fill:#0f1626;stroke-width:2}
