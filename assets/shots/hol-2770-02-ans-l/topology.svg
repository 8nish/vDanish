<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2770-02-ANS-L</title>
  <desc id="d">Management: the SSP installer (ssp-i.site-a.vcf.lab), the Security Services Platform instance (ssp.site-a.vcf.lab, with Security Intelligence, Network Traffic Analysis, NDR and Metrics) and the NSX Manager nsx-wld01-a, paired one to one with the SSP. Workload domain: Tier-0 t0-wld01-a with two Tier-1 gateways. t1-dmz01-a has web-seg-a (10.1.13.129/25) with the VMs idps-01 (10.1.13.140) and idps-02 (10.1.13.141). t1-wld-a has app-seg-a (10.1.14.129/25) and db-seg-a (10.1.14.1/25) with idps-03 (10.1.14.10). IDS/IPS inspects at every VM and on both Tier-1 gateways. Attack 1 is command and control and exfiltration between idps-01 and idps-02 on the same segment. Attack 2 is lateral movement from idps-01 to idps-03 across both Tier-1s. VMFlowGen deploys the demo VMs and replays the attacks. At the bottom, the steps of the lab: detect only, detect and prevent, virtual patch, NTA detectors and the NDR campaign.</desc>
