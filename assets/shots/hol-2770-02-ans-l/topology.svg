<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2770-02-ANS-L</title>
  <desc id="d">The Security Services Platform (ssp.site-a.vcf.lab, running NTA and NDR) paired with the NSX Manager nsx-wld01-a, where IDS/IPS is configured. Below, Tier-0 t0-wld01-a with two Tier-1 gateways. t1-dmz01-a has web-seg-a (10.1.13.129/25) with the VMs idps-01 (10.1.13.140) and idps-02 (10.1.13.141). t1-wld-a has db-seg-a (10.1.14.1/25) with idps-03 (10.1.14.10). IDS/IPS inspects at every VM and on both Tier-1 gateways. Attack 1 is command and control and exfiltration between idps-01 and idps-02 on the same segment. Attack 2 is lateral movement from idps-01 to idps-03 across both Tier-1s.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
  </defs>
  <style>
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .card{fill:#0f1626;stroke-width:2}
    .chip{fill:#141d31;stroke:#3a4a68;stroke-width:1.5}
    .name{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#7f8ea8}
    .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#fca5a5}
    .seg{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#93c5fd}
    .badge{fill:#1e2a44}
    .badget{font-family:JetBrains Mono,Consolas,monospace;font-size:11px;font-weight:700;fill:#22d3ee;text-anchor:middle}
    .ips{fill:#2a1e0a;stroke:#f59e0b;stroke-width:1.5}
    .ipst{font-family:JetBrains Mono,Consolas,monospace;font-size:10.5px;font-weight:700;fill:#fcd34d;text-anchor:middle}
    .rt{fill:#101a2e;stroke:#94a3b8;stroke-width:2}
    .rtn{font-family:JetBrains Mono,Consolas,monospace;font-size:13px;font-weight:700;fill:#eef3fb}
    .rts{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11.5px;fill:#7f8ea8}
    .vmn{font-family:JetBrains Mono,Consolas,monospace;font-size:14px;font-weight:700;fill:#eef3fb}
    .vms{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#7f8ea8}
    .numt{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;font-weight:700;fill:#0a1120;text-anchor:middle}
    .wire{stroke:#94a3b8;stroke-width:2;fill:none}
    .segl{stroke:#60a5fa;stroke-width:3;fill:none}
    .atk{stroke:#f87171;stroke-width:2.5;fill:none}
