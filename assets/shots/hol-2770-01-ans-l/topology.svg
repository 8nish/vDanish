<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2770-01-ANS-L</title>
  <desc id="d">One flat network with the SSP installer (ssp-i.site-a.vcf.lab), the Security Services Platform instance (ssp.site-a.vcf.lab, 3 controllers and 6 workers, with Metrics, Security Intelligence, Network Traffic Analysis and NDR), the NSX Manager nsx-wld01-a with the DFW, the transport nodes esx-05a to esx-07a, DNS and the proxy. Below, the datacenter assets imported from a CSV: shared services (DNS, NTP, LDAP), region nam with us-west prod (sharepoint, jira) and us-south dev (workday, sap, lotus domino, confluence), and region emea with fr-paris prod (peoplesoft) and uk-lon dev (servicenow). At the bottom the four DFW stages: assessment, infrastructure services, environments and applications.</desc>
