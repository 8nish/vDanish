<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-labelledby="t d">
  <title id="t">Lab workflow: HOL-2740-05-ANS-L</title>
  <desc id="d">Module 1, F5 to Avi. Step 1: a tenant called hol for everything that comes over. Step 2: the F5 migration wizard in offline mode with the bigip.conf file, controller version 32.1.1. Step 3: 6 iRules and 110 virtual services reviewed. Step 4: a fixed tier1_patch.yml, then the playbook is pushed. Module 2, NSX load balancer to Avi. Step 5: check the 9 virtual servers on the NSX load balancer. Step 6: the NSX-T migration wizard with the NSX Manager 10.1.1.24 and the hol tenant. Step 7: review all 9, then push the playbook. Step 8: cutover from NSX to Avi, then clean up NSX. Steps 2 and 4 are where the lab manual provided did not work for me.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
  </defs>
  <style>
    .card{fill:#0f1626;stroke-width:2}
    .mod{font-family:JetBrains Mono,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:1px;text-anchor:middle}
    .row{font-family:JetBrains Mono,Consolas,monospace;font-size:13px;font-weight:600;letter-spacing:1.5px;fill:#7f8ea8}
    .ttl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:700;fill:#eef3fb}
    .txt{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#c6d1e2}
    .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#c6d1e2}
    .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none}
  </style>
  <rect width="1200" height="512" rx="18" fill="#0a1120"/>
  <rect width="1200" height="512" rx="18" fill="url(#grid)"/>
  <text x="40" y="52" font-family="JetBrains Mono,Consolas,monospace" font-size="15" font-weight="600" letter-spacing="2" fill="#22d3ee">HOL-2740-05-ANS-L · WORKFLOW</text>
<text x="40" y="92" class="row">MODULE 1 · F5 TO AVI</text>
<rect x="40" y="106" width="258" height="134" rx="14" class="card" stroke="#60a5fa"/>
<rect x="60" y="124" width="74" height="22" rx="6" fill="#60a5fa" fill-opacity=".14"/>
<text x="97" y="139" class="mod" fill="#60a5fa">STEP 1</text>
<text x="62" y="174" class="ttl">Tenant hol</text>
<text x="62" y="201" class="txt">A tenant for everything</text><text x="62" y="223" class="txt">that comes over.</text>
<line x1="301" y1="173" x2="324" y2="173" class="flow" marker-end="url(#ar)"/>
<rect x="327" y="106" width="258" height="134" rx="14" class="card" stroke="#f59e0b"/>
<rect x="347" y="124" width="74" height="22" rx="6" fill="#f59e0b" fill-opacity=".14"/>
<text x="384" y="139" class="mod" fill="#f59e0b">STEP 2</text>
<text x="349" y="174" class="ttl">F5 wizard</text>
<text x="349" y="201" class="txt">Offline, the bigip.conf,</text><text x="349" y="223" class="txt">controller version 32.1.1.</text>
<line x1="588" y1="173" x2="611" y2="173" class="flow" marker-end="url(#ar)"/>
<rect x="614" y="106" width="258" height="134" rx="14" class="card" stroke="#60a5fa"/>
<rect x="634" y="124" width="74" height="22" rx="6" fill="#60a5fa" fill-opacity=".14"/>
<text x="671" y="139" class="mod" fill="#60a5fa">STEP 3</text>
<text x="636" y="174" class="ttl">iRules, config</text>
<text x="636" y="201" class="txt">6 iRules reviewed,</text><text x="636" y="223" class="txt">110 virtual services.</text>
<line x1="875" y1="173" x2="898" y2="173" class="flow" marker-end="url(#ar)"/>
<rect x="901" y="106" width="258" height="134" rx="14" class="card" stroke="#f59e0b"/>
<rect x="921" y="124" width="74" height="22" rx="6" fill="#f59e0b" fill-opacity=".14"/>
<text x="958" y="139" class="mod" fill="#f59e0b">STEP 4</text>
<text x="923" y="174" class="ttl">Patch, push</text>
<text x="923" y="201" class="txt">Fixed tier1_patch.yml,</text><text x="923" y="223" class="txt">then the playbook.</text>
<text x="40" y="282" class="row">MODULE 2 · NSX LB TO AVI</text>
