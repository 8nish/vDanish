<text x="62" y="391" class="txt">9 virtual servers on the</text><text x="62" y="413" class="txt">NSX load balancer.</text>
<line x1="301" y1="363" x2="324" y2="363" class="flow" marker-end="url(#ar)"/>
<rect x="327" y="296" width="258" height="134" rx="14" class="card" stroke="#60a5fa"/>
<rect x="347" y="314" width="74" height="22" rx="6" fill="#60a5fa" fill-opacity=".14"/>
<text x="384" y="329" class="mod" fill="#60a5fa">STEP 6</text>
<text x="349" y="364" class="ttl">NSX-T wizard</text>
<text x="349" y="391" class="txt">NSX Manager 10.1.1.24,</text><text x="349" y="413" class="txt">tenant hol.</text>
<line x1="588" y1="363" x2="611" y2="363" class="flow" marker-end="url(#ar)"/>
<rect x="614" y="296" width="258" height="134" rx="14" class="card" stroke="#60a5fa"/>
<rect x="634" y="314" width="74" height="22" rx="6" fill="#60a5fa" fill-opacity=".14"/>
<text x="671" y="329" class="mod" fill="#60a5fa">STEP 7</text>
<text x="636" y="364" class="ttl">Review, push</text>
<text x="636" y="391" class="txt">Review all 9, then</text><text x="636" y="413" class="txt">push the playbook.</text>
<line x1="875" y1="363" x2="898" y2="363" class="flow" marker-end="url(#ar)"/>
<rect x="901" y="296" width="258" height="134" rx="14" class="card" stroke="#34d399"/>
<rect x="921" y="314" width="74" height="22" rx="6" fill="#34d399" fill-opacity=".14"/>
<text x="958" y="329" class="mod" fill="#34d399">STEP 8</text>
<text x="923" y="364" class="ttl">Cutover</text>
<text x="923" y="391" class="txt">NSX off, Avi on,</text><text x="923" y="413" class="txt">then clean up NSX.</text>
<rect x="42" y="466" width="26" height="14" rx="7" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="1.5"/>
<text x="82" y="478" class="lbl">Where the lab manual provided did not work for me: the controller version and the patch file.</text>
