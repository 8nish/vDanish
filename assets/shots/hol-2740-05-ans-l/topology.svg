<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2740-05-ANS-L</title>
  <desc id="d">An F5 BIG-IP config file, hol_advanced_bigip.conf, is uploaded to the Avi Conversion Tool (ACT) in Region A. ACT runs the F5 Migration wizard and uses the Avi API to build the Avi objects on the Avi Controller wld01a-avi, version 32.1.1, which is both the staging and the destination controller. Everything lands in the tenant hol, on Cloud-nsx-wld01-a, VRF wld01-a-t1 and the SE group Default-Group.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
  </defs>
  <style>
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .card{fill:#0f1626;stroke-width:2}
    .chip{fill:#141d31;stroke:#3a4a68;stroke-width:1.5}
    .name{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700}
    .loc{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;font-weight:400;fill:#c6d1e2}
    .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#c6d1e2}
    .role{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:1px;text-anchor:middle}
    .vmn{font-family:JetBrains Mono,Consolas,monospace;font-size:14px;font-weight:700;fill:#eef3fb}
    .vms{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#7f8ea8}
    .q{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;font-weight:700;fill:#7dd3fc;text-anchor:middle}
    .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none}
  </style>
  <rect width="1200" height="392" rx="18" fill="#0a1120"/>
  <rect width="1200" height="392" rx="18" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="15" font-weight="600" letter-spacing="2" fill="#22d3ee">HOL-2740-05-ANS-L · LAB TOPOLOGY</text>
<rect x="40" y="96" width="300" height="196" rx="16" class="card" stroke="#fb7185"/>
<text x="60" y="130" class="name" fill="#fb7185">F5 BIG-IP<tspan dx="10" class="loc">config</tspan></text>
<text x="60" y="155" class="vms">the source, no live F5 needed</text>
<rect x="60" y="174" width="260" height="96" rx="10" class="chip"/>
<text x="78" y="202" class="vmn">hol_advanced_bigip.conf</text>
<text x="78" y="226" class="vms">virtual services, pools,</text><text x="78" y="248" class="vms">monitors and iRules</text>
<rect x="410" y="96" width="280" height="196" rx="16" class="card" stroke="#22d3ee"/>
<text x="430" y="130" class="name" fill="#22d3ee">ACT<tspan dx="10" class="loc">Avi Conversion Tool</tspan></text>
<text x="430" y="155" class="vms">vDefend and Avi Conversion Tool</text>
<rect x="430" y="174" width="240" height="96" rx="10" class="chip"/>
<text x="448" y="202" class="vmn">F5 Migration</text>
<text x="448" y="226" class="vms">a 6-step wizard that turns</text><text x="448" y="248" class="vms">the config into Avi objects</text>
<rect x="760" y="96" width="400" height="196" rx="16" class="card" stroke="#f59e0b"/>
<text x="780" y="130" class="name" fill="#f59e0b">Avi Controller</text>
<rect x="1054" y="112" width="86" height="24" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
<text x="1097" y="128" class="role" fill="#f59e0b">32.1.1</text>
<text x="780" y="155" class="vms">wld01a-avi · staging and destination</text>
<rect x="780" y="174" width="360" height="96" rx="10" class="chip"/>
<text x="798" y="202" class="vmn">tenant hol</text>
<text x="798" y="226" class="vms">Cloud-nsx-wld01-a · VRF wld01-a-t1</text><text x="798" y="248" class="vms">SE group Default-Group</text>
<line x1="340" y1="194" x2="406" y2="194" class="flow" marker-end="url(#ar)"/>
<text x="373" y="182" class="q">upload</text>
<line x1="690" y1="194" x2="756" y2="194" class="flow" marker-end="url(#ar)"/>
<text x="723" y="182" class="q">API</text>
<path d="M42 335 H68" class="flow" marker-end="url(#ar)"/><text x="82" y="340" class="lbl">ACT reads the F5 config and builds the Avi objects in the hol tenant through the controller API.</text>
<rect x="42" y="356" width="26" height="14" rx="7" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="82" y="368" class="lbl">Staging builds the profiles, policies and DataScripts, the destination gets the result. Here both are the same controller.</text>
</svg>
