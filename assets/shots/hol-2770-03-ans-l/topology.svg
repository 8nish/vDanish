<rect x="82" y="540" width="328" height="34" rx="8" class="chip"/><text x="246.0" y="561.0" class="chipt">SSP · 3 controllers + 6 workers</text>
<text x="82" y="610" class="sub">SSP VMs in resource pool RP_SSP_ssp</text>
<rect x="450" y="388" width="368" height="256" rx="14" fill="#0c1322" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6"/>
<text x="470" y="418" class="zname" fill="#a78bfa">Workload Domain 01 zone</text>
<text x="470" y="438" class="sub">group WD01</text>
