<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2770-03-ANS-L</title>
  <desc id="d">The VCF management domain (vc-mgmt-a, cluster-mgmt-01a with eight hosts and DFW turned on) split into three zones: the VCF Fleet Management zone with VCF Operations, the collector, SDDC Manager, the license servers, fleet management services, VCF Automation and Operations for Networks; the management domain zone with vc-mgmt-a, nsx-mgmt-01a and the Security Services Platform; and the Workload Domain 01 zone with vc-wld01-a and nsx-wld01-01a. Outside sit the infrastructure services (DNS, NTP, DHCP, Active Directory, syslog) and the external zone (bastion jump host, tools, backup, SMTP, internet). Below, the DFW categories in order: Ethernet, Emergency, Infrastructure with 9 rules, Environment with 37 and Application with 35.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
  </defs>
  <style>
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .card{fill:#0f1626;stroke:#2c3b58;stroke-width:2}
    .chip{fill:#141d31;stroke:#3a4a68;stroke-width:1.5}
    .chipt{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#eef3fb;text-anchor:middle}
    .name{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700}
    .zname{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;font-weight:700}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#7f8ea8}
    .badge{fill:#1e2a44}
    .badget{font-family:JetBrains Mono,Consolas,monospace;font-size:11px;font-weight:700;fill:#22d3ee;text-anchor:middle}
    .cat{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;font-weight:700;text-anchor:middle}
  </style>
  <rect width="1200" height="850" rx="18" fill="#0a1120"/>
  <rect width="1200" height="850" rx="18" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="15" font-weight="600" letter-spacing="2" fill="#22d3ee">HOL-2770-03-ANS-L · LAB TOPOLOGY</text>
<rect x="904" y="34" width="30" height="18" rx="5" class="badge"/><text x="919" y="47" class="badget">M1</text><text x="944" y="48" class="sub">= the lab module that uses it</text>
<rect x="40" y="84" width="800" height="580" rx="16" class="card" stroke="#3b82f6"/>
<text x="62" y="116" class="name" fill="#60a5fa">Management domain</text>
<text x="62" y="137" class="sub">vc-mgmt-a · cluster-mgmt-01a · esx-01a to 04a, esx-14a to 17a · DFW turned on</text>
<rect x="706" y="102" width="30" height="18" rx="5" class="badge"/><text x="721" y="115" class="badget">M1</text>
