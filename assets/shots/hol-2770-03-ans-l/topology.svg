<rect x="82" y="222" width="170" height="34" rx="8" class="chip"/><text x="167.0" y="243.0" class="chipt">ops-a (VCF Operations)</text>
<rect x="266" y="222" width="170" height="34" rx="8" class="chip"/><text x="351.0" y="243.0" class="chipt">opscollector-01a</text>
<rect x="450" y="222" width="170" height="34" rx="8" class="chip"/><text x="535.0" y="243.0" class="chipt">sddcmanager-a</text>
