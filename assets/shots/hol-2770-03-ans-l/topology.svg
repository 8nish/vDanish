<rect x="888" y="442" width="250" height="32" rx="8" class="chip"/><text x="1013.0" y="462.0" class="chipt">Bastion jump host</text>
<rect x="888" y="485" width="250" height="32" rx="8" class="chip"/><text x="1013.0" y="505.0" class="chipt">Tools</text>
