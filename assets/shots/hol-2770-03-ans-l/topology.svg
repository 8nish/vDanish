<text x="82" y="186" class="zname" fill="#22d3ee">VCF Fleet Management zone</text>
<text x="82" y="206" class="sub">group SG_VCF_FLEET</text>
<rect x="686" y="170" width="30" height="18" rx="5" class="badge"/><text x="701" y="183" class="badget">M2</text>
<rect x="720" y="170" width="30" height="18" rx="5" class="badge"/><text x="735" y="183" class="badget">M3</text>
