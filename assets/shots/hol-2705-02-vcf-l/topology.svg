    <text x="600" y="344" text-anchor="middle" font-weight="600" fill="#c4b5fd">RTEP · MTU 1700</text>
    <text x="1004" y="368" fill="#c4b5fd">RTEP VLAN 51</text>
    <text x="1004" y="386" fill="#c6d1e2">10.2.7.2/25</text>
    <rect x="1112" y="355" width="30" height="18" rx="5" fill="#1e2a44"/>
    <text x="1127" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">M2</text>
  </g>

  <!-- edge to T0 -->
  <path d="M310 398V452M890 398V452" stroke="#fb923c" stroke-width="3"/>

  <!-- stretched Tier-0 -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="60" y="452" width="1080" height="96" rx="16" fill="#1a130c" fill-opacity=".9" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="12 6"/>
    <circle cx="112" cy="500" r="28" fill="#0f1a2e" stroke="#fb923c" stroke-width="3"/>
    <use href="#arrows" x="94" y="482" width="36" height="36" color="#fdba74"/>
    <text x="156" y="488" font-size="18" font-weight="700" fill="#fdba74">mgmt-t0-stretched</text>
    <text x="156" y="510" font-size="14" fill="#c6d1e2">Tier-0 · Active Active · local AS <tspan font-family="JetBrains Mono, Consolas, monospace" fill="#eef3fb">65001</tspan></text>
    <rect x="156" y="520" width="82" height="20" rx="6" fill="#34d399"/>
    <text x="197" y="534" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#04140d">PRIMARY</text>
    <text x="250" y="535" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7f8ea8">egress for both sites</text>

    <rect x="640" y="468" width="200" height="20" rx="6" fill="#fbbf24"/>
    <text x="740" y="482" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#1c1200">SECONDARY · PRIORITY 1</text>
    <text x="640" y="512" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#c6d1e2">to AS 65005: local AS 65006</text>
    <text x="640" y="532" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#c6d1e2">route map: prepend 65006</text>
    <rect x="1096" y="464" width="30" height="18" rx="5" fill="#1e2a44"/>
    <text x="1111" y="477" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#22d3ee">M3</text>
  </g>

  <!-- T0 to T1 -->
  <path d="M600 548V596" stroke="#60a5fa" stroke-width="3"/>

  <!-- stretched Tier-1 -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="60" y="596" width="1080" height="62" rx="16" fill="#0c1424" fill-opacity=".9" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="12 6"/>
    <circle cx="112" cy="627" r="22" fill="#0f1a2e" stroke="#60a5fa" stroke-width="3"/>
    <use href="#arrows" x="98" y="613" width="28" height="28" color="#93c5fd"/>
    <text x="148" y="624" font-size="17" font-weight="700" fill="#93c5fd">mgmt-t1-stretched</text>
    <text x="148" y="645" font-size="13" fill="#c6d1e2">Tier-1 · Distributed Only · advertises connected segments</text>
    <rect x="1096" y="606" width="30" height="18" rx="5" fill="#1e2a44"/>
    <text x="1111" y="619" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#22d3ee">M4</text>
  </g>

  <!-- segments -->
  <path d="M400 658V726" stroke="#34d399" stroke-width="3"/>
  <path d="M460 658V776" stroke="#f87171" stroke-width="3"/>
  <rect x="80" y="723" width="1040" height="7" rx="3.5" fill="#34d399"/>
  <rect x="80" y="773" width="1040" height="7" rx="3.5" fill="#f87171"/>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="13">
    <text x="408" y="712" fill="#34d399">.129</text>
    <text x="468" y="762" fill="#f87171">.1</text>
    <text x="1120" y="712" text-anchor="end" font-weight="600" fill="#eef3fb">web-seg-stretched · <tspan fill="#34d399">10.1.13.128/25</tspan></text>
    <text x="1120" y="762" text-anchor="end" font-weight="600" fill="#eef3fb">DB-seg-stretched · <tspan fill="#f87171">10.1.13.0/25</tspan></text>
  </g>

  <!-- workloads -->
  <path d="M160 730V804" stroke="#34d399" stroke-width="3"/>
  <path d="M300 780V804" stroke="#f87171" stroke-width="3"/>
  <use href="#vm" x="120" y="804" width="80" height="50" color="#34d399"/>
  <use href="#vm" x="260" y="804" width="80" height="50" color="#f87171"/>
  <g font-family="JetBrains Mono, Consolas, monospace" text-anchor="middle">
    <text x="160" y="876" font-size="14" font-weight="600" fill="#eef3fb">app01-web-01a</text>
    <text x="160" y="894" font-size="12" fill="#7f8ea8">10.1.13.200</text>
    <text x="300" y="876" font-size="14" font-weight="600" fill="#eef3fb">app01-db-01a</text>
    <text x="300" y="894" font-size="12" fill="#7f8ea8">10.1.13.10</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#7f8ea8">
    <text x="640" y="822">Both segments exist in both locations</text>
    <text x="640" y="842" font-family="JetBrains Mono, Consolas, monospace" font-size="12">overlay-vds01-mgmt-01a · overlay-vds01-mgmt-01b</text>
    <text x="640" y="864">The VMs run in Palo Alto (vc-mgmt-a)</text>
  </g>
</svg>
