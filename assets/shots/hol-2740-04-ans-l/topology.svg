<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2740-04-ANS-L</title>
  <desc id="d">Two Avi controllers act as two GSLB sites. region01a in Palo Alto is the leader (site 1 controller, 10.1.1.90) with the DNS virtual service global-dns-vs-01a on 10.1.13.137 and the app virtual services adv-app-a and secure-app-a. region01b in Barcelona is the follower (site 2 controller, 10.1.1.92) with global-dns-vs-01b on 10.1.14.137 and adv-app-b and secure-app-b. The leader syncs the GSLB config to the follower. A client asks either DNS virtual service for a name under global.vcf.lab, gets one site's VIP back and connects to it directly.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>
  <style>
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .card{fill:#0f1626;stroke-width:2}
    .chip{fill:#141d31;stroke:#3a4a68;stroke-width:1.5}
    .name{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700}
    .loc{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:#c6d1e2}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#7f8ea8}
    .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#c6d1e2}
    .role{font-family:JetBrains Mono,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:1px;text-anchor:middle}
    .badge{fill:#1e2a44}
    .badget{font-family:JetBrains Mono,Consolas,monospace;font-size:11px;font-weight:700;fill:#22d3ee;text-anchor:middle}
    .vmn{font-family:JetBrains Mono,Consolas,monospace;font-size:14px;font-weight:700;fill:#eef3fb}
    .vms{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#7f8ea8}
    .q{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;font-weight:700;fill:#7dd3fc}
    .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none}
    .sync{stroke:#f59e0b;stroke-width:2.5;fill:none;stroke-dasharray:7 6}
    .synct{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;font-weight:700;fill:#f59e0b;text-anchor:middle}
  </style>
  <rect width="1200" height="590" rx="18" fill="#0a1120"/>
  <rect width="1200" height="590" rx="18" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="15" font-weight="600" letter-spacing="2" fill="#22d3ee">HOL-2740-04-ANS-L · LAB TOPOLOGY</text>
<rect x="904" y="34" width="30" height="18" rx="5" class="badge"/><text x="919" y="47" class="badget">M2</text><text x="944" y="48" class="sub">= the lab module that uses it</text>
<rect x="470" y="80" width="260" height="62" rx="10" class="card" stroke="#34d399"/>
<text x="488" y="106" class="vmn" style="fill:#34d399">Client</text><text x="488" y="127" class="vms">asks for *.global.vcf.lab</text>
<path d="M600 142 V172 M365 172 H985" class="flow"/>
<path d="M365 172 V276" class="flow" marker-end="url(#ar)"/><path d="M985 172 V276" class="flow" marker-end="url(#ar)"/>
<text x="353" y="192" class="q" text-anchor="end">DNS query</text><text x="997" y="192" class="q">DNS query</text>
<rect x="40" y="200" width="500" height="270" rx="16" class="card" stroke="#60a5fa"/>
<text x="60" y="234" class="name" fill="#60a5fa">region01a</text><text x="158" y="234" class="loc">Palo Alto, CA</text>
<rect x="424" y="216" width="96" height="24" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
<text x="472" y="232" class="role" fill="#60a5fa">LEADER</text>
<text x="60" y="257" class="vms">site 1 controller · 10.1.1.90</text>
<rect x="60" y="280" width="460" height="70" rx="10" class="chip"/>
<text x="80" y="308" class="vmn">global-dns-vs-01a</text><text x="80" y="331" class="vms">DNS · VIP 10.1.13.137 · SE group gslb01a</text>
<rect x="470" y="292" width="30" height="18" rx="5" class="badge"/><text x="485" y="305" class="badget">M1</text>
<rect x="60" y="370" width="460" height="70" rx="10" class="chip"/>
<text x="80" y="398" class="vmn">adv-app-a · secure-app-a</text><text x="80" y="421" class="vms">app virtual services, the GSLB pool members</text>
<rect x="402" y="382" width="30" height="18" rx="5" class="badge"/><text x="417" y="395" class="badget">M3</text>
<rect x="436" y="382" width="30" height="18" rx="5" class="badge"/><text x="451" y="395" class="badget">M4</text>
<rect x="470" y="382" width="30" height="18" rx="5" class="badge"/><text x="485" y="395" class="badget">M5</text>
<rect x="660" y="200" width="500" height="270" rx="16" class="card" stroke="#c084fc"/>
<text x="680" y="234" class="name" fill="#c084fc">region01b</text><text x="778" y="234" class="loc">Barcelona</text>
<rect x="1044" y="216" width="96" height="24" rx="12" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<text x="1092" y="232" class="role" fill="#c084fc">FOLLOWER</text>
<text x="680" y="257" class="vms">site 2 controller · 10.1.1.92</text>
<rect x="680" y="280" width="460" height="70" rx="10" class="chip"/>
<text x="700" y="308" class="vmn">global-dns-vs-01b</text><text x="700" y="331" class="vms">DNS · VIP 10.1.14.137 · SE group gslb01b</text>
<rect x="1090" y="292" width="30" height="18" rx="5" class="badge"/><text x="1105" y="305" class="badget">M1</text>
<rect x="680" y="370" width="460" height="70" rx="10" class="chip"/>
<text x="700" y="398" class="vmn">adv-app-b · secure-app-b</text><text x="700" y="421" class="vms">app virtual services, the GSLB pool members</text>
<rect x="1022" y="382" width="30" height="18" rx="5" class="badge"/><text x="1037" y="395" class="badget">M3</text>
<rect x="1056" y="382" width="30" height="18" rx="5" class="badge"/><text x="1071" y="395" class="badget">M4</text>
<rect x="1090" y="382" width="30" height="18" rx="5" class="badge"/><text x="1105" y="395" class="badget">M5</text>
<line x1="544" y1="335" x2="652" y2="335" class="sync" marker-end="url(#am)"/>
<text x="600" y="322" class="synct">config sync</text>
<rect x="585" y="348" width="30" height="18" rx="5" class="badge"/><text x="600" y="361" class="badget">M2</text>
<path d="M42 523 H68" class="flow" marker-end="url(#ar)"/><text x="82" y="528" class="lbl">The client can ask either DNS virtual service. It gets one site's VIP back and connects to that site directly.</text>
<rect x="40" y="548" width="30" height="18" rx="5" class="badge"/><text x="55" y="561" class="badget">M3</text>
<rect x="74" y="548" width="30" height="18" rx="5" class="badge"/><text x="89" y="561" class="badget">M4</text>
<rect x="108" y="548" width="30" height="18" rx="5" class="badge"/><text x="123" y="561" class="badget">M5</text>
<text x="150" y="562" class="lbl">basic-app, adv-app and secure-app are made on the leader, with pools in both sites.</text>
</svg>
