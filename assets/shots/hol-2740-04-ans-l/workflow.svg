<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Lab workflow: HOL-2740-04-ANS-L</title>
  <desc id="d">The lab in six steps. Module 1: a GSLB SE group, then a DNS virtual service in each region on port 53. Module 2: GSLB sites, region01a in Palo Alto as the leader and region01b in Barcelona as the follower. Module 3: basic-app, with a Palo Alto pool at priority 20 and a Barcelona pool at 10, so active/standby. Module 4: adv-app, with virtual services and plain IPs as members and consistent hash. Module 5: secure-app, with a geo DB so DNS answers with the site closest to the client. Module 6: a DNS policy rule on the DNS virtual service that drops UDP queries.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
  </defs>
  <style>
    .card{fill:#0f1626;stroke-width:2}
    .mod{font-family:JetBrains Mono,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:1px;text-anchor:middle}
    .ttl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:700;fill:#eef3fb}
    .txt{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#c6d1e2}
    .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none}
  </style>
  <rect width="1200" height="470" rx="18" fill="#0a1120"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)"/>
  <text x="40" y="52" font-family="JetBrains Mono,Consolas,monospace" font-size="15" font-weight="600" letter-spacing="2" fill="#22d3ee">HOL-2740-04-ANS-L · WORKFLOW</text>
<rect x="40" y="84" width="340" height="140" rx="14" class="card" stroke="#60a5fa"/>
<rect x="62" y="102" width="92" height="22" rx="6" fill="#60a5fa" fill-opacity=".14"/>
<text x="108" y="117" class="mod" fill="#60a5fa">MODULE 1</text>
<text x="64" y="152" class="ttl">DNS virtual services</text>
<text x="64" y="181" class="txt">A GSLB SE group, then a DNS virtual</text><text x="64" y="203" class="txt">service in each region on port 53.</text>
<rect x="430" y="84" width="340" height="140" rx="14" class="card" stroke="#60a5fa"/>
<rect x="452" y="102" width="92" height="22" rx="6" fill="#60a5fa" fill-opacity=".14"/>
<text x="498" y="117" class="mod" fill="#60a5fa">MODULE 2</text>
<text x="454" y="152" class="ttl">GSLB sites</text>
<text x="454" y="181" class="txt">region01a in Palo Alto is the leader,</text><text x="454" y="203" class="txt">region01b in Barcelona follows.</text>
<rect x="820" y="84" width="340" height="140" rx="14" class="card" stroke="#f59e0b"/>
<rect x="842" y="102" width="92" height="22" rx="6" fill="#f59e0b" fill-opacity=".14"/>
<text x="888" y="117" class="mod" fill="#f59e0b">MODULE 3</text>
<text x="844" y="152" class="ttl">basic-app</text>
<text x="844" y="181" class="txt">Pools by priority: Palo Alto 20,</text><text x="844" y="203" class="txt">Barcelona 10. Active/standby.</text>
<rect x="40" y="290" width="340" height="140" rx="14" class="card" stroke="#f59e0b"/>
<rect x="62" y="308" width="92" height="22" rx="6" fill="#f59e0b" fill-opacity=".14"/>
<text x="108" y="323" class="mod" fill="#f59e0b">MODULE 4</text>
<text x="64" y="358" class="ttl">adv-app</text>
<text x="64" y="387" class="txt">Virtual services and plain IPs as</text><text x="64" y="409" class="txt">members, consistent hash.</text>
<rect x="430" y="290" width="340" height="140" rx="14" class="card" stroke="#f59e0b"/>
<rect x="452" y="308" width="92" height="22" rx="6" fill="#f59e0b" fill-opacity=".14"/>
<text x="498" y="323" class="mod" fill="#f59e0b">MODULE 5</text>
<text x="454" y="358" class="ttl">secure-app</text>
<text x="454" y="387" class="txt">A geo DB, so DNS answers with the</text><text x="454" y="409" class="txt">site closest to the client.</text>
<rect x="820" y="290" width="340" height="140" rx="14" class="card" stroke="#c084fc"/>
<rect x="842" y="308" width="92" height="22" rx="6" fill="#c084fc" fill-opacity=".14"/>
<text x="888" y="323" class="mod" fill="#c084fc">MODULE 6</text>
<text x="844" y="358" class="ttl">DNS policy</text>
<text x="844" y="387" class="txt">A rule on the DNS virtual service</text><text x="844" y="409" class="txt">that drops UDP queries.</text>
<line x1="382" y1="154" x2="426" y2="154" class="flow" marker-end="url(#ar)"/>
<line x1="772" y1="154" x2="816" y2="154" class="flow" marker-end="url(#ar)"/>
<line x1="382" y1="360" x2="426" y2="360" class="flow" marker-end="url(#ar)"/>
<line x1="772" y1="360" x2="816" y2="360" class="flow" marker-end="url(#ar)"/>
<path d="M990 226 V257 H210 V286" class="flow" marker-end="url(#ar)"/>
</svg>
