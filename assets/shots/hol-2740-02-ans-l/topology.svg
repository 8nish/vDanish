<rect x="310" y="101" width="30" height="18" rx="5" class="badge"/><text x="325" y="114" class="badget">M1</text>
<rect x="344" y="101" width="30" height="18" rx="5" class="badge"/><text x="359" y="114" class="badget">M2</text>
