<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-labelledby="t d">
  <title id="t">Lab topology: HOL-2740-02-ANS-L</title>
  <desc id="d">VCF Operations, VCF Automation and the Avi Controller alb-a.site-a.vcf.lab (cloud Cloud-nsx-wld01-a) sit on top. The controller creates and runs the Service Engines in workload domain wld01-a, in the VPC default-us-east-1 of the Acme-East-A organization. The two Service Engines sit on the Services Subnet 100.64.32.0/24 and hold the virtual IPs: 10.1.9.5 for hol-l4-vs on TCP 22, 10.1.9.6 for hol-l7-gateway on HTTP 80 and 10.1.9.7 for hol-l7-full-stack on HTTPS 443. They send the traffic to the servers on 172.30.0.0/27: hol-vm on 172.30.0.2 port 22, hol-webservers-vm1 and vm2 on 172.30.0.3 and .4 port 80, and the full-stack blueprint VMs on port 80. The VIPs come from the ipspace-wld-a block, 10.1.9.1-126.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94b2e6" stroke-opacity=".06"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
  </defs>
  <style>
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .card{fill:#0f1626;stroke-width:2}
    .chip{fill:#141d31;stroke:#3a4a68;stroke-width:1.5}
    .name{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700}
    .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#7f8ea8}
    .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#c6d1e2}
    .badge{fill:#1e2a44}
    .badget{font-family:JetBrains Mono,Consolas,monospace;font-size:11px;font-weight:700;fill:#22d3ee;text-anchor:middle}
    .vmn{font-family:JetBrains Mono,Consolas,monospace;font-size:13.5px;font-weight:700;fill:#eef3fb}
    .vms{font-family:JetBrains Mono,Consolas,monospace;font-size:12px;fill:#7f8ea8}
    .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none}
    .ctl{stroke:#f59e0b;stroke-width:2;fill:none;stroke-dasharray:7 6}
  </style>
