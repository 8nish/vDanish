<line x1="634" y1="406" x2="754" y2="406" class="flow" marker-end="url(#ar)"/>
<rect x="758" y="432" width="384" height="36" rx="8" class="chip"/>
<text x="772" y="455" class="vmn">full-stack blueprint VMs</text>
<text x="1128" y="455" class="vms" text-anchor="end">:80</text>
<line x1="634" y1="450" x2="754" y2="450" class="flow" marker-end="url(#ar)"/>
